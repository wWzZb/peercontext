name: Publish Skill site

on:
  push:
    branches: [main]
    paths:
      - ".agents/skills/peer-context/**"
      - "scripts/generate-skill-site.js"
      - "skill-site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify generated Skill site
        run: node scripts/generate-skill-site.js --check
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: skill-site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
